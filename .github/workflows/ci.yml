# This workflow sets up a machine and CALLS the gate script. It restates no
# step of it, and no check may be added here.
#
# `local-gate.md` § 3: the local run must execute the pipeline's own
# definition, not a copy. Everything CI does lives in scripts/local-ci.sh, so
# the run before your push and the run on GitHub cannot disagree. Adding a step
# here instead creates a second list, and the drift is discovered by a red
# build — the thing running locally was meant to prevent.
#
# Setup (installing a toolchain, checking out, caching) belongs here. Checks
# belong in the script.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# local-gate.md § 9. A newer push to a branch cancels its older run, which
# saves minutes. NOT on the default branch: there a cancelled run would hide
# which commit broke it. The event is in the key so a push and a scheduled
# run never cancel or queue behind each other. A tag ref is not the default
# branch, so a workflow that also publishes on a tag must not copy this
# expression: a re-pushed tag would cancel a half-done release. There, cancel
# on pull_request only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  gate:
    # A versioned image, not ubuntu-latest: -latest moves to a new Ubuntu
    # with no commit here, so the same tree could build differently.
    runs-on: ubuntu-26.04
    # local-gate.md § 9. A hung job otherwise burns up to six hours. Size this
    # for a COLD build (no cache), or a cache miss reads as a hang.
    timeout-minutes: 30
    steps:
      # Pinned by digest: a tag is mutable and runs a different program on the
      # day it changes (security.md § 8). **A sha of an OLDER release is still a
      # pin below latest stable and owes a recorded reason** — same section — so
      # bump this when you bump anything else, rather than treating the digest as
      # the end of the obligation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this, checkout leaves the job's token in .git/config, where
          # every later step can use it. `zizmor` reports it as `artipacked`, and
          # check-code runs zizmor — so a scaffolded project failed its own gate
          # on the first run. Turn it back ON, with a comment saying so, only in
          # a job that actually pushes.
          persist-credentials: false

      # Install the toolchain the script expects. Versions are pinned in the
      # SCRIPT and read from it, so one commit cannot use two versions.
      - name: Install build tools and Qt 6
        run: |
          read -ra packages < <(./scripts/local-ci.sh --ci-packages)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      # Ubuntu's nasm package is older than the engine's 3.02 floor, so NASM
      # is built from source once per pin and runner image, then cached
      # (local-gate.md § 9). The key holds the version, the tarball's hash
      # and the image, so a new pin or image misses and builds afresh.
      # No other cache: ccache is declined here for now, since the gate's
      # whole build is a few seconds of the run and per-commit keys would
      # need pruning.
      - name: Read the NASM pin
        id: nasm-pin
        run: |
          read -r version sha256 < <(./scripts/local-ci.sh --nasm-pin)
          {
            echo "version=$version"
            echo "sha256=$sha256"
            echo "key=nasm-${ImageOS:?}-$version-$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Restore NASM
        id: nasm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nasm-bin
          key: ${{ steps.nasm-pin.outputs.key }}

      - name: Build NASM from source
        id: nasm-build
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        env:
          NASM_VERSION: ${{ steps.nasm-pin.outputs.version }}
          NASM_SHA256: ${{ steps.nasm-pin.outputs.sha256 }}
        run: |
          work=$(mktemp -d)
          curl -fsSL -o "$work/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          echo "$NASM_SHA256  $work/nasm.tar.xz" | sha256sum --check --strict
          tar -xJf "$work/nasm.tar.xz" -C "$work"
          cd "$work/nasm-$NASM_VERSION"
          ./configure --prefix=/usr/local
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm-bin
          install -m 0755 nasm ~/nasm-bin/nasm

      # Saved as soon as it is built, whatever the gate does later, so a red
      # or timed-out run still leaves the next one warm.
      - name: Save NASM
        if: steps.nasm-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nasm-bin
          key: ${{ steps.nasm-pin.outputs.key }}

      # A cached binary is checked like a fresh one: it must report the pin.
      - name: Install NASM
        env:
          NASM_VERSION: ${{ steps.nasm-pin.outputs.version }}
        run: |
          sudo install -m 0755 ~/nasm-bin/nasm /usr/local/bin/nasm
          nasm -v
          nasm -v | grep -q "^NASM version $NASM_VERSION "

      - name: Run the gate
        run: ./scripts/local-ci.sh
